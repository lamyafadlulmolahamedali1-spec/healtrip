server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # security headers
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location / { try_files $uri $uri/ =404; }

  # same-origin API so the browser never needs a second host
  location /locales/ { try_files $uri =404; add_header Cache-Control "no-cache"; }

  location /api/  { proxy_pass http://api:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location /health { proxy_pass http://api:4000/health; }

  location ~* \.(mp4|jpg|jpeg|png|webp|woff2)$ { expires 30d; access_log off; }
}
